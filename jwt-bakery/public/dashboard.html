<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard — Bakery</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="nav">
      <div class="brand">🥐 Bakery</div>
      <nav>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/admin">Admin</a>
        <a href="/logout">Logout</a>
      </nav>
    </header>

    <main>
      <h1>Your Dashboard</h1>
      <p>
        Welcome back, <strong id="username">...</strong>! Your current role:
        <span id="role" class="badge">...</span>
      </p>

      <p>
        Today's staff-only recipe list lives at <a href="/admin">/admin</a>, for
        bakers with the right role.
      </p>
    </main>

    <footer>
      Bakery &mdash; a training environment, not a real bakery.
    </footer>

    <script>
      (async () => {
        const resp = await fetch("/api/me");
        if (!resp.ok) {
          window.location.href = "/login";
          return;
        }
        const data = await resp.json();
        document.getElementById("username").textContent = data.username;
        document.getElementById("role").textContent = data.role;
      })();
    </script>
  </body>
</html>
